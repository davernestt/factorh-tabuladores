name: FactoRH NOM-035 · TypeScript Check

on:
  push:
    branches:
      - nom035-v1
      - 'nom035-*'
      - 'feature/portal-*'
      - 'feature/demo-*'
      - 'feature/catalogo-*'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npx tsc --noEmit
