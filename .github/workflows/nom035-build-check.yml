name: FactoRH NOM-035 · Production Build Check
on:
  push:
    branches:
      - nom035-v1
      - 'nom035-*'
      - 'feature/portal-*'
      - 'feature/demo-*'
      - 'feature/estudios-*'
      - 'feature/vistas-*'
      - 'feature/catalogo-*'
      - 'feature/invitacion-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-only
      SUPABASE_SECRET_KEY: dummy-build-only
      NEXT_PUBLIC_SITE_URL: https://localhost.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate synthetic NOM-035 demos
        run: npx --yes tsx scripts/nom035-demo-smoke.ts
      - name: Verify Word DOCX archive
        run: unzip -t /tmp/factorh_nom035_report_smoke.docx
      - name: Build app
        run: npm run build
