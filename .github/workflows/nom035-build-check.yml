name: FactoRH NOM-035 · Production Build Check
on:
  push:
    branches:
      - nom035-v1
      - 'nom035-*'
      - 'feature/portal-*'
      - 'feature/demo-*'
      - 'feature/estudios-*'
      - 'feature/vistas-*'
      - 'feature/catalogo-*'
      - 'feature/invitacion-*'
      - 'feature/solicitudes-*'
      - 'feature/ese-*'
      - 'feature/360-*'
      - 'feature/psicometria-*'
      - 'feature/centro-*'
      - 'feature/roles-*'
      - 'feature/coordinadora-*'
      - 'feature/paola-*'
      - 'feature/ese-formato-*'
      - 'feature/marca-*'
      - 'fix/logotipo-*'
      - 'fix/leadership-*'
      - 'fix/pdl-*'
      - 'fix/empresa-*'
      - 'fix/psychometric-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-only
      SUPABASE_SECRET_KEY: dummy-build-only
      NEXT_PUBLIC_SITE_URL: https://localhost.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify client portal uses typographic mark
        run: node scripts/check-client-wordmark.cjs
      - name: Verify typographic brand
        run: node scripts/check-brand-wordmark.cjs
      - name: Validate synthetic NOM-035 demos
        run: npx --yes tsx scripts/nom035-demo-smoke.ts
      - name: Verify Word DOCX archive
        run: unzip -t /tmp/factorh_nom035_report_smoke.docx
      - name: Validate ESE Word and PDF exports
        run: npx --yes tsx scripts/ese-report-smoke.ts
      - name: Verify ESE Word ZIP and PDF signature
        run: |
          unzip -t /tmp/factorh_ese_master_smoke.docx
          test "$(grep -ao '/Type /Page /Parent' /tmp/factorh_ese_master_smoke.pdf | wc -l)" -ge 13
      - name: Upload fictional ESE QA documents
        uses: actions/upload-artifact@v4
        with:
          name: ese-master-qa
          path: |
            /tmp/factorh_ese_master_smoke.pdf
            /tmp/factorh_ese_master_smoke.docx
          retention-days: 2
      - name: Validate partial 360 radar without false zero scores
        run: npx --yes tsx scripts/360-radar-partial-smoke.ts
      - name: Validate 360 gap interpretation
        run: npx --yes tsx scripts/360-gap-interpretation-smoke.ts
      - name: Validate 360 confidential comments
        run: npx --yes tsx scripts/360-confidential-comments-smoke.ts
      - name: Validate 360 department privacy
        run: npx --yes tsx scripts/360-departments-smoke.ts
      - name: Validate 360 demo and commercial visibility
        run: npx --yes tsx scripts/360-commercial-smoke.ts
      - name: Validate multi-test psychometric free trial
        run: npx --yes tsx scripts/psychometric-trial-batteries-smoke.ts
      - name: Validate client center pricing and promotion
        run: npx --yes tsx scripts/client-center-pricing-smoke.ts
      - name: Validate operational client center
        run: npx --yes tsx scripts/centro-clientes-operativo-smoke.ts
      - name: Validate client service demos and plans
        run: npx --yes tsx scripts/client-service-demos-smoke.ts
      - name: Validate private leadership cases rubric
        run: npx --yes tsx scripts/leadership-cases-private-rubric-smoke.ts
      - name: Verify stable PDL URLs and safe resends
        run: npx --yes tsx scripts/pdl-urls-resend-smoke.ts
      - name: Validate New/Edit Company form text contrast
        run: npx --yes tsx scripts/company-form-contrast-smoke.ts
      - name: Validate user roles and client requests
        run: npx --yes tsx scripts/user-roles-client-requests-smoke.ts
      - name: Validate staged coordinator access matrix
        run: npx --yes tsx scripts/coordinator-permission-matrix-smoke.ts
      - name: Validate operator permissions and security boundaries
        run: npx --yes tsx scripts/qa-paola-operadora-access.ts
      - name: Verify psychometric answer recovery and reporting
        run: npx --yes tsx scripts/psychometric-save-recovery-smoke.ts
      - name: Verify stable native Word and adaptive PDF reports
        run: npx --yes tsx scripts/psychometric-report-layout-smoke.ts
      - name: Render full executive summary and reject overlaps or clipped text
        run: npx --yes tsx scripts/psychometric-readable-pdf-smoke.ts
      - name: Verify real DOCX ZIP and XML integrity
        run: |
          unzip -t /tmp/factorh_psychometric_qa.docx
          python - <<'PY'
          import zipfile, xml.etree.ElementTree as ET
          p='/tmp/factorh_psychometric_qa.docx'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              for required in ('[Content_Types].xml','_rels/.rels','word/document.xml','word/_rels/document.xml.rels','word/media/chart-1.png'):
                  assert required in names, required
              for name in names:
                  if name.endswith('.xml') or name.endswith('.rels'):
                      ET.fromstring(z.read(name))
              doc=z.read('word/document.xml').decode('utf-8')
              assert 'wp:inline' in doc
              assert 'Dimensión 1' in doc
          print('PSYCHOMETRIC_DOCX_XML_OK: paquete legible, XML válido e imágenes embebidas')
          PY
      - name: Save fictional report for QA
        uses: actions/upload-artifact@v4
        with:
          name: factorh-psychometric-docx-qa
          path: /tmp/factorh_psychometric_qa.docx
          retention-days: 1
      - name: Build app
        run: npm run build
