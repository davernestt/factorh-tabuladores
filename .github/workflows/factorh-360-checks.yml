name: FactoRH 360 checks
on:
  pull_request:
    paths:
      - "lib/feedback360-*.ts"
      - "lib/supabase/proxy.ts"
      - "app/api/admin/360/**"
      - "tests/feedback360-access.test.mjs"
      - ".github/workflows/factorh-360-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check routing and invitation regression tests
        run: node --experimental-strip-types --test tests/feedback360-access.test.mjs
      - name: Next.js build (nonproduction test values)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "ci-public-key-not-real"
          SUPABASE_SECRET_KEY: "ci-server-key-not-real"
